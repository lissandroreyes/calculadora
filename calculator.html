<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <style>
        :root {
            --baja: #e74c3c; --media: #f39c12; --buena: #27ae60; --alta: #2ecc71; --muyalta: #1abc9c;
        }
        body { font-family: 'Segoe UI', sans-serif; background-color: #f0f2f5; display: flex; justify-content: center; padding: 20px; }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 500px; }
        h2 { color: #1a73e8; margin: 0 0 15px 0; font-size: 1.4rem; text-align: center; }
        .section-title { font-size: 0.75rem; color: #888; text-transform: uppercase; letter-spacing: 1px; margin: 15px 0 10px 0; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        
        /* Grid Tasas con fecha */
        .grid-tasas { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
        .tasa-item { display: flex; flex-direction: column; }
        .tasa-time { font-size: 0.6rem; color: #999; margin-top: 3px; text-align: center; font-weight: bold; }
        
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .input-group { margin-bottom: 12px; }
        label { display: block; font-size: 0.75rem; color: #444; margin-bottom: 4px; font-weight: 600; }
        input, select { width: 100%; padding: 8px 10px; border: 2px solid #eee; border-radius: 6px; box-sizing: border-box; font-size: 0.9rem; }
        
        .api-status { padding: 6px; border-radius: 6px; font-size: 0.7rem; margin-bottom: 15px; text-align: center; }
        .status-ok { background: #e6ffed; color: #1e7e34; }
        .status-err { background: #ffebee; color: #c62828; }
        
        .tool-box { background: #f8f9fa; padding: 15px; border-radius: 10px; border: 1px solid #e9ecef; margin: 15px 0; }
        .conv-grid-2x2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

        .r3-container { display: flex; align-items: center; gap: 10px; justify-content: center; }
        .r3-col { display: flex; flex-direction: column; gap: 8px; width: 40%; }
        .r3-res { border: 2px solid #1a73e8 !important; background: #e8f0fe !important; font-weight: bold; color: #1a73e8; }

        .results { background: #1a73e8; color: white; padding: 18px; border-radius: 10px; margin-top: 15px; transition: background 0.4s ease; }
        .res-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .val-big { font-size: 1.4rem; font-weight: bold; }
        .label-status { font-size: 0.75rem; font-weight: bold; text-transform: uppercase; background: rgba(255,255,255,0.2); padding: 2px 8px; border-radius: 4px; }
        
        .detail-box { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; border-top: 1px solid rgba(255,255,255,0.2); padding-top: 12px; }
        .detail-item { background: rgba(255,255,255,0.1); padding: 8px; border-radius: 6px; text-align: center; }
        .detail-item small { display: block; font-size: 0.65rem; text-transform: uppercase; opacity: 0.8; }
    </style>
</head>
<body>

<div class="card">
    <h2>Calculadora</h2>
    <div id="api-status" class="api-status">Consultando tasas...</div>

    <div class="section-title">Tasas de Cambio</div>
    <div class="grid-tasas">
        <div class="tasa-item">
            <label>P ($)</label>
            <input type="number" id="tasaP" oninput="actualizarTodo()">
            <div id="timeP" class="tasa-time">--:--</div>
        </div>
        <div class="tasa-item">
            <label>O ($)</label>
            <input type="number" id="tasaO" oninput="actualizarTodo()">
            <div id="timeO" class="tasa-time">--:--</div>
        </div>
        <div class="tasa-item">
            <label>Euro (€)</label>
            <input type="number" id="tasaE" oninput="actualizarTodo()">
            <div id="timeE" class="tasa-time">--:--</div>
        </div>
    </div>

    <div class="tool-box">
        <div class="section-title" style="margin-top:0; border:none">Conversor</div>
        <div class="conv-grid-2x2">
            <div class="input-group"><label>Monto P ($)</label><input type="number" id="convP" placeholder="0.00" oninput="convertir('P')"></div>
            <div class="input-group"><label>Monto O ($)</label><input type="number" id="convO" placeholder="0.00" oninput="convertir('O')"></div>
            <div class="input-group"><label>Monto €</label><input type="number" id="convE" placeholder="0.00" oninput="convertir('E')"></div>
            <div class="input-group"><label>Monto Bs</label><input type="number" id="convB" placeholder="0.00" oninput="convertir('B')"></div>
        </div>
    </div>

    <div class="tool-box">
        <div class="section-title" style="margin-top:0; border:none">Regla de Tres</div>
        <div class="r3-container">
            <div class="r3-col">
                <input type="number" id="r3_a" placeholder="Si A">
                <input type="number" id="r3_c" placeholder="Tengo C">
            </div>
            <div style="font-weight: bold; color: #1a73e8;">→</div>
            <div class="r3-col">
                <input type="number" id="r3_b" placeholder="Es B">
                <input type="text" id="r3_res" class="r3-res" placeholder="X" readonly>
            </div>
        </div>
    </div>

    <div class="section-title">Datos de Compra</div>
    <div class="grid-2">
        <div class="input-group"><label>Cant. Unidades:</label><input type="number" id="qty" value="8" oninput="calcular(true)"></div>
        <div class="input-group"><label>Costo Monto:</label><input type="number" id="costoMonto" value="10" oninput="calcular(true)"></div>
    </div>
    <div class="input-group">
        <label>Comprado en:</label>
        <select id="monedaCompra" onchange="calcular(true)">
            <option value="P">Dólar P (Paralelo)</option>
            <option value="O">Dólar O (Oficial)</option>
            <option value="E">Euro (€)</option>
            <option value="B">Bolívares (Bs.)</option>
        </select>
    </div>

    <div class="section-title">Margen y Venta</div>
    <div class="grid-2">
        <div class="input-group"><label style="color:#1a73e8">Margen %:</label><input type="number" id="margen" value="30" oninput="calcular(true)"></div>
        <div class="input-group"><label style="color:#1a73e8">Venta (Bs):</label><input type="number" id="manualPVP" oninput="calcular(false)"></div>
    </div>

    <div class="results" id="resCard">
        <div class="res-row">
            <span id="txtStatus" class="label-status">ESPERANDO</span>
            <div style="text-align: right; line-height: 1.2;">
                <div style="font-size: 0.8rem;">$ <span id="pvpO">0.00</span></div>
                <div style="font-size: 0.8rem;">€ <span id="pvpE">0.00</span></div>
            </div>
        </div>
        <div class="res-row">
            <span>Sugerido (Bs):</span>
            <span id="pvpB" class="val-big">0.00</span>
        </div>
        <div class="detail-box">
            <div class="detail-item"><small>Costo u:</small><span id="uCosto">0.00</span></div>
            <div class="detail-item"><small>Ganancia u:</small><span id="uGanancia">0.00</span></div>
        </div>
    </div>
</div>

<script>
    const f2 = (num) => (Math.round((num + Number.EPSILON) * 100) / 100).toFixed(2);

    function formatTime(isoString) {
        if (!isoString) return "--:--";
        const date = new Date(isoString);
        return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: true });
    }

    // Regla de tres dinámica
    document.querySelectorAll('[ id^="r3_" ]').forEach(el => {
        el.addEventListener('input', () => {
            const a = parseFloat(document.getElementById('r3_a').value);
            const b = parseFloat(document.getElementById('r3_b').value);
            const c = parseFloat(document.getElementById('r3_c').value);
            document.getElementById('r3_res').value = (a && b && c) ? f2((c * b) / a) : "";
        });
    });

    async function obtenerTasas() {
        try {
            const [resDolar, resEuro] = await Promise.all([
                fetch("https://ve.dolarapi.com/v1/dolares"),
                fetch("https://ve.dolarapi.com/v1/euros")
            ]);
            const dataDolar = await resDolar.json();
            const dataEuro = await resEuro.json();

            const p = dataDolar.find(d => d.fuente === 'paralelo');
            const o = dataDolar.find(d => d.fuente === 'oficial');
            const e = dataEuro.find(d => d.fuente === 'oficial');

            // Asignar Valores
            document.getElementById('tasaP').value = f2(p.promedio);
            document.getElementById('tasaO').value = f2(o.promedio);
            document.getElementById('tasaE').value = f2(e.promedio);
            
            // Asignar Tiempos Individuales
            document.getElementById('timeP').innerText = formatTime(p.fechaActualizacion);
            document.getElementById('timeO').innerText = formatTime(o.fechaActualizacion);
            document.getElementById('timeE').innerText = formatTime(e.fechaActualizacion);
            
            document.getElementById('api-status').innerText = "Tasas actualizadas";
            document.getElementById('api-status').className = "api-status status-ok";
        } catch (err) {
            document.getElementById('api-status').innerText = "Error API - Use manual";
            document.getElementById('api-status').className = "api-status status-err";
        }
        calcular(true);
    }

    function calcular(porMargen) {
        const tP = parseFloat(document.getElementById('tasaP').value) || 0;
        const tO = parseFloat(document.getElementById('tasaO').value) || 0;
        const tE = parseFloat(document.getElementById('tasaE').value) || 0;
        const qty = parseFloat(document.getElementById('qty').value) || 1;
        const monto = parseFloat(document.getElementById('costoMonto').value) || 0;
        const moneda = document.getElementById('monedaCompra').value;
        const inputMargen = document.getElementById('margen');
        const inputPVP = document.getElementById('manualPVP');

        let cB = (moneda === 'P') ? monto * tP : (moneda === 'O') ? monto * tO : (moneda === 'E') ? monto * tE : monto;
        const cU = cB / qty;
        let pvpB = 0, margenF = 0;

        if (porMargen) {
            margenF = parseFloat(inputMargen.value) || 0;
            pvpB = cU / (1 - (margenF / 100));
            inputPVP.value = f2(pvpB);
        } else {
            pvpB = parseFloat(inputPVP.value) || 0;
            if (pvpB > 0) {
                margenF = ((pvpB - cU) / pvpB) * 100;
                inputMargen.value = f2(margenF);
            }
        }
        actualizarUI(pvpB, tO, tE, cU, margenF);
    }

    function actualizarUI(pvpB, tO, tE, cU, m) {
        const resCard = document.getElementById('resCard');
        const txtStatus = document.getElementById('txtStatus');
        let color = "#7f8c8d", texto = "Negocio";

        if (m < 0) { color = "#333"; texto = "Pérdida"; }
        else if (m < 5) { color = "var(--baja)"; texto = "Baja"; }
        else if (m < 15) { color = "var(--media)"; texto = "Media"; }
        else if (m < 30) { color = "var(--buena)"; texto = "Buena"; }
        else if (m < 50) { color = "var(--alta)"; texto = "Alta"; }
        else { color = "var(--muyalta)"; texto = "Muy Alta"; }

        resCard.style.backgroundColor = color;
        txtStatus.innerText = texto;
        document.getElementById('pvpB').innerText = parseFloat(f2(pvpB)).toLocaleString('es-VE', {minimumFractionDigits: 2});
        document.getElementById('pvpO').innerText = tO > 0 ? f2(pvpB / tO) : "0.00";
        document.getElementById('pvpE').innerText = tE > 0 ? f2(pvpB / tE) : "0.00";
        document.getElementById('uCosto').innerText = f2(cU);
        document.getElementById('uGanancia').innerText = f2(pvpB - cU);
    }

    function convertir(origen) {
        const tP = parseFloat(document.getElementById('tasaP').value) || 0;
        const tO = parseFloat(document.getElementById('tasaO').value) || 0;
        const tE = parseFloat(document.getElementById('tasaE').value) || 0;
        const valP = document.getElementById('convP'), valO = document.getElementById('convO'), valE = document.getElementById('convE'), valB = document.getElementById('convB');

        let mB = 0;
        if (origen === 'P') mB = parseFloat(valP.value) * tP;
        else if (origen === 'O') mB = parseFloat(valO.value) * tO;
        else if (origen === 'E') mB = parseFloat(valE.value) * tE;
        else if (origen === 'B') mB = parseFloat(valB.value);

        if (origen !== 'B') valB.value = mB ? f2(mB) : "";
        if (origen !== 'P') valP.value = (mB && tP) ? f2(mB / tP) : "";
        if (origen !== 'O') valO.value = (mB && tO) ? f2(mB / tO) : "";
        if (origen !== 'E') valE.value = (mB && tE) ? f2(mB / tE) : "";
    }

    function actualizarTodo() { calcular(true); convertir('B'); }
    obtenerTasas();
</script>
</body>
</html>
